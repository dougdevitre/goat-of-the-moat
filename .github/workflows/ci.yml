name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard JavaScript and static UI
        run: node tests/dashboard_smoke.cjs
      - name: Validate scoring engine
        run: python -m unittest discover -s tests -v
      - name: Run synthetic example
        run: python -m goat_moat.demo
