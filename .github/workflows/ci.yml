name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard JavaScript and static UI
        run: node tests/dashboard_smoke.cjs
      - name: Validate scoring engine
        run: python -m unittest discover -s tests -v
      - name: Run synthetic example
        run: python -m goat_moat.demo

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static site and wait until ready
        run: |
          nohup python -m http.server 8000 --bind 127.0.0.1 > /tmp/goat-http.log 2>&1 < /dev/null &
          server_pid=$!
          echo "HTTP server PID: $server_pid"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/tools/; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "HTTP server exited before readiness"
              cat /tmp/goat-http.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "HTTP server did not become ready within 30 seconds"
            cat /tmp/goat-http.log || true
            exit 1
          fi
          echo "HTTP server ready at http://127.0.0.1:8000/tools/"
      - name: Run browser acceptance
        env:
          BASE_URL: http://127.0.0.1:8000
          QA_ARTIFACT_DIR: qa-artifacts
        run: node tests/dashboard_browser.cjs
      - name: Print server diagnostics on failure
        if: failure()
        run: |
          echo "=== Local HTTP server ==="
          cat /tmp/goat-http.log || true
          echo "=== Node / Python ==="
          node --version
          python --version
          echo "=== Available QA artifacts ==="
          find qa-artifacts -maxdepth 2 -type f -print 2>/dev/null || true
      - name: Upload mobile screenshots and print PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-xx-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
